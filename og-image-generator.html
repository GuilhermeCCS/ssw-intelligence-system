<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .og-container {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            position: relative;
            overflow: hidden;
        }
        
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(34, 197, 94, 0.05) 0%, transparent 50%);
        }
        
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            color: white;
        }
        
        .title {
            font-size: 64px;
            font-weight: 900;
            color: white;
            margin: 0;
            line-height: 1.1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .title span {
            color: #6366f1;
        }
        
        .subtitle {
            font-size: 24px;
            color: #94a3b8;
            margin: 20px 0 40px;
            max-width: 800px;
            line-height: 1.4;
        }
        
        .features {
            display: flex;
            gap: 30px;
            margin-top: 40px;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            min-width: 200px;
        }
        
        .feature-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }
        
        .feature-text {
            color: #e2e8f0;
            font-size: 16px;
            font-weight: 600;
        }
        
        .url {
            position: absolute;
            bottom: 40px;
            left: 60px;
            color: #64748b;
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="og-container">
        <div class="bg-pattern"></div>
        <div class="content">
            <div class="logo-section">
                <div class="logo-placeholder">SSW</div>
            </div>
            <h1 class="title">S.S.W <span>| INTELLIGENCE</span></h1>
            <p class="subtitle">Plataforma de auditoria web e benchmarking competitivo impulsionada por IA</p>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🔍</div>
                    <div class="feature-text">Auditoria Completa</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📊</div>
                    <div class="feature-text">Análise Competitiva</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🤖</div>
                    <div class="feature-text">IA Avançada</div>
                </div>
            </div>
        </div>
        <div class="url">ssw-intelligence.com</div>
    </div>
</body>
</html>
