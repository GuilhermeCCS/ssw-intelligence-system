<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e293b" />
    </linearGradient>
    <linearGradient id="logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#a855f7" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Background Pattern -->
  <circle cx="240" cy="126" r="200" fill="#6366f1" opacity="0.1"/>
  <circle cx="960" cy="504" r="300" fill="#a855f7" opacity="0.1"/>
  <circle cx="480" cy="378" r="150" fill="#22c55e" opacity="0.05"/>
  
  <!-- Logo -->
  <rect x="60" y="60" width="80" height="80" rx="20" fill="url(#logo)" filter="url(#glow)"/>
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">SSW</text>
  
  <!-- Main Title -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle">
    SSW 
    <tspan fill="#6366f1">| INTELLIGENCE</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">
    Plataforma de auditoria web e benchmarking competitivo
  </text>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">
    impulsionada por IA
  </text>
  
  <!-- Feature Cards -->
  <g transform="translate(200, 420)">
    <rect x="0" y="0" width="200" height="100" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="100" y="40" font-size="32" text-anchor="middle">🔍</text>
    <text x="100" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Auditoria Completa</text>
  </g>
  
  <g transform="translate(500, 420)">
    <rect x="0" y="0" width="200" height="100" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="100" y="40" font-size="32" text-anchor="middle">📊</text>
    <text x="100" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Análise Competitiva</text>
  </g>
  
  <g transform="translate(800, 420)">
    <rect x="0" y="0" width="200" height="100" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="100" y="40" font-size="32" text-anchor="middle">🤖</text>
    <text x="100" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">IA Avançada</text>
  </g>
  
  <!-- URL -->
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="18" fill="#64748b" font-weight="500">ssw-intelligence.com</text>
</svg>

