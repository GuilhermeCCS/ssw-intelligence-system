server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    error_page 400 /errors/400.html;
    error_page 401 /errors/401.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 408 /errors/408.html;
    error_page 429 /errors/429.html;
    error_page 500 /errors/500.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /index.html {
        # Only canonicalize an external request, not Nginx's internal SPA/index rewrite.
        if ($request_uri ~ ^/index[.]html) { return 301 /$is_args$args; }
        try_files /index.html =404;
    }
    location = /precos { return 301 /precos/$is_args$args; }
    location = /termos { return 301 /termos/$is_args$args; }
    location = /terms { return 301 /termos/$is_args$args; }
    location = /terms/ { return 301 /termos/$is_args$args; }
    location = /sites { return 301 /sites/$is_args$args; }

    # Preserve every existing SPA entry; missing assets and unknown routes remain 404.
    location ~ ^/(login|cadastro|home|analise-gratis|agents|domains|history|ranking|about|tutorial)/?$ {
        try_files /index.html =404;
    }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(docs|scripts|tests?|debug|backup|logs|tmp|node_modules|vendor)(/|$) { return 404; }
    location ~* \.(map|sql|bak|backup|log|env|zip)$ { return 404; }
    location = /_headers { return 404; }
    location = /_redirects { return 404; }
    location /errors/ { internal; }
    location / { try_files $uri $uri/ =404; }
}
