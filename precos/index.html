    <style>
        html,
        body {
            min-height: 100%;
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        .terms-topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 1px solid #e5eaf0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(18px);
        }

        .terms-topbar-inner {
            width: min(1240px, calc(100% - 32px));
            min-height: 68px;
            display: grid;
            grid-template-columns: minmax(190px, 1fr) auto minmax(190px, 1fr);
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin: 0 auto;
        }

        .terms-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-decoration: none;
        }

        .terms-brand img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .terms-center-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .terms-center-nav a {
            position: relative;
            color: #111827;
            font-size: 13px;
            font-weight: 750;
            text-decoration: none;
            transition: color .18s ease;
        }

        .terms-center-nav a:hover,
        .terms-center-nav a.is-active {
            color: #2563eb;
        }

        .terms-center-nav a.is-active::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -17px;
            height: 2px;
            border-radius: 999px;
            background: #2563eb;
        }

        .terms-top-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .terms-top-actions a {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 18px;
            border: 1px solid #d8e1ec;
            border-radius: 9px;
            color: #111827;
            font-size: 13px;
            font-weight: 850;
            text-decoration: none;
            background: #ffffff;
        }

        .terms-top-actions a:last-child {
            background: #111827;
            color: #ffffff;
            border-color: #111827;
            box-shadow: 0 14px 28px rgba(17, 24, 39, 0.14);
        }

        .pricing-page-shell {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.08), transparent 32%),
                linear-gradient(180deg, #ffffff 0%, #f8fafc 52%, #ffffff 100%);
        }

        .pricing-page-loading,
        .pricing-page-error {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 32px;
            text-align: center;
        }

        .pricing-page-loading span {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(130, 146, 168, 0.22);
            border-top-color: #22d3ee;
            border-radius: 999px;
            animation: pricingPageSpin 0.8s linear infinite;
        }

        .pricing-page-loading p,
        .pricing-page-error p {
            color: #8292a8;
            font-size: 14px;
            margin: 0;
        }

        .pricing-page-error h1 {
            color: #0f172a;
            font-size: 28px;
            margin: 0;
        }

        .pricing-page-error a {
            color: #22d3ee;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        @keyframes pricingPageSpin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 860px) {
            .terms-topbar-inner {
                width: min(100% - 24px, 1180px);
                min-height: auto;
                grid-template-columns: 1fr;
                padding: 12px 0;
            }

            .terms-center-nav {
                order: 3;
                gap: 18px;
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 2px;
            }

            .terms-center-nav a.is-active::after {
                bottom: -7px;
            }

            .terms-top-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                justify-content: stretch;
            }
        }
