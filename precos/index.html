    <style>
        html,
        body {
            min-height: 100%;
            margin: 0;
            background: #020408;
            color: #f0f4ff;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        .terms-topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(2, 4, 8, 0.86);
            backdrop-filter: blur(18px);
        }

        .terms-topbar-inner {
            width: min(1180px, calc(100% - 32px));
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin: 0 auto;
        }

        .terms-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-decoration: none;
        }

        .terms-brand img {
            width: 32px;
            height: 32px;
        }

        .terms-top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .terms-top-actions a {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 13px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 8px;
            color: #dbeafe;
            font-size: 13px;
            font-weight: 750;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.035);
        }

        .terms-top-actions a:first-child {
            background: #f4f7fb;
            color: #020408;
        }

        .pricing-page-shell {
            min-height: 100vh;
            background: #020408;
        }

        .pricing-page-loading,
        .pricing-page-error {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 32px;
            text-align: center;
        }

        .pricing-page-loading span {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(130, 146, 168, 0.22);
            border-top-color: #22d3ee;
            border-radius: 999px;
            animation: pricingPageSpin 0.8s linear infinite;
        }

        .pricing-page-loading p,
        .pricing-page-error p {
            color: #8292a8;
            font-size: 14px;
            margin: 0;
        }

        .pricing-page-error h1 {
            color: #ffffff;
            font-size: 28px;
            margin: 0;
        }

        .pricing-page-error a {
            color: #22d3ee;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        @keyframes pricingPageSpin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 620px) {
            .terms-topbar-inner {
                width: min(100% - 24px, 1180px);
                min-height: auto;
                flex-direction: column;
                align-items: stretch;
                padding: 12px 0;
            }

            .terms-top-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
