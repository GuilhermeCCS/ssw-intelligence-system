name: ssw-intelligence-local

services:
  api:
    build:
      context: ../sswapi-main
    env_file:
      - ../sswapi-main/.env
    environment:
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PUBLIC_FRONTEND_URL: http://localhost:3000
      PUBLIC_BACKEND_URL: http://localhost:8080
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      args:
        API_URL: http://localhost:8080
        VITE_MP_PUBLIC_KEY: ${VITE_MP_PUBLIC_KEY:?Configure VITE_MP_PUBLIC_KEY em ssw-frontend/.env}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
